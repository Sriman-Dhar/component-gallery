<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sriman Gallery. Thirty components in thirteen weeks. Each one ships with its live demo, its prompt and its code." />
    <meta name="theme-color" content="#0B0B0E" />
    <title>Sriman Gallery</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Frame theme before first paint: the stored choice, else dark (the studio default).
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('gallery-frame-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Clash Display (display: 500 and 600 only, Fontshare, free license). The trailing comma in the weight
         list is deliberate: without it the API appends an unasked pairing family to the stylesheet. -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,&display=swap" />
    <!-- Geist (UI) + Geist Mono (metadata, prompt, code). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
