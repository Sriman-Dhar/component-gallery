<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sriman's Gallery. Thirty components in thirteen weeks. Each one ships with its live demo, its prompt and its code." />
    <meta name="theme-color" content="#0B0B0E" />
    <title>Sriman's Gallery</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Frame theme before first paint: the stored choice, else dark (the studio default).
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('gallery-frame-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Shantell Sans (display, hand drawn and built for reading; OFL): roman and italic at 500 to 700. Google
         serves one variable file per style and subset, so the five weights cost two latin requests. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
    />
    <!-- Geist (UI) + Geist Mono (metadata, prompt, code). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
